name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
      - name: Format
        run: ~/.moon/bin/moon fmt --check
      - name: Strict multi-target check
        run: ~/.moon/bin/moon check --deny-warn --target all
      - name: Test Wasm
        run: ~/.moon/bin/moon test --target wasm
      - name: Test Wasm-GC
        run: ~/.moon/bin/moon test --target wasm-gc
      - name: Test JavaScript
        run: ~/.moon/bin/moon test --target js
      - name: Run demo
        run: ~/.moon/bin/moon run cmd/main --target js -- demo

